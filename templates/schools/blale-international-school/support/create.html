{% extends school_layout_template %}

{% block title %}Open Support Ticket - {{ school.name }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between pb-5 border-b border-slate-200">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Submit Support Request</h1>
            <p class="text-sm text-slate-500 mt-1">Create a helpdesk ticket for academic, billing, or technical assistance.</p>
        </div>
        <a href="{% url 'support:ticket_list' %}" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition">
            Back to Tickets
        </a>
    </div>

    <!-- Form -->
    <form method="POST" class="p-6 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Subject *</label>
            <input type="text" name="subject" value="{{ subject|default:'' }}" required placeholder="e.g., Discrepancy on First Term Tuition Invoice" class="w-full text-sm border-slate-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 bg-slate-50 py-2.5 px-3.5">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Category *</label>
                <select name="category" class="w-full text-sm border-slate-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 bg-slate-50 py-2.5 px-3">
                    {% for code, label in category_choices %}
                        <option value="{{ code }}" {% if category == code %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Priority *</label>
                <select name="priority" class="w-full text-sm border-slate-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 bg-slate-50 py-2.5 px-3">
                    {% for code, label in priority_choices %}
                        <option value="{{ code }}" {% if priority == code %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Detailed Description *</label>
            <textarea name="description" rows="6" required placeholder="Provide relevant details (student ID, invoice number, or screenshots description)..." class="w-full text-sm border-slate-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 bg-slate-50 p-3.5 leading-relaxed">{{ description|default:'' }}</textarea>
        </div>

        <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
            <a href="{% url 'support:ticket_list' %}" class="px-5 py-2.5 text-sm font-medium text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200 transition">
                Cancel
            </a>
            <button type="submit" class="inline-flex items-center gap-2 px-6 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-xl hover:bg-blue-700 shadow-sm transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                Submit Ticket
            </button>
        </div>
    </form>
</div>
{% endblock %}
